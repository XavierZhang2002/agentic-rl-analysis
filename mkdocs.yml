site_name: "LLM Post-Training 与 Agentic RL 研究"
site_description: "系统梳理大语言模型后训练与 Agentic RL 的技术报告"
site_author: "Xavier"
site_url: https://XavierZhang2002.github.io/agentic-rl-analysis

repo_name: "agentic-rl-analysis"
repo_url: https://github.com/XavierZhang2002/agentic-rl-analysis
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.path
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/XavierZhang2002

nav:
  - 首页: index.md
  - Post-Training 技术报告:
      - 导读: post-training/index.md
      - 1. 基础：流程与范式:
          - 1.1 训练全景: post-training/ch1/1.1-training-landscape.md
          - 1.2 两大范式: post-training/ch1/1.2-paradigms.md
          - 1.3 流程范式: post-training/ch1/1.3-pipeline-paradigms.md
          - 1.4 奖励设计: post-training/ch1/1.4-reward-lineage.md
      - 2. 算法主线:
          - 2.1 PPO — 经典策略优化: post-training/ch2/2.1-ppo.md
          - 2.2 GRPO — RLVR 的奠基: post-training/ch2/2.2-grpo.md
          - 2.3 DAPO — 工业级工程优化: post-training/ch2/2.3-dapo.md
          - 2.4 VAPO — Value 路线回归: post-training/ch2/2.4-vapo.md
          - 2.5 CISPO 与 GSPO: post-training/ch2/2.5-cispo-gspo.md
          - 2.6 SAPO — 软门控: post-training/ch2/2.6-sapo.md
          - 2.7 信任域的新解法: post-training/ch2/2.7-trust-region-2026.md
      - 3. 训练经济学:
          - 3.1 预算分配: post-training/ch3/3.1-rollout-allocation.md
          - 3.2 免 Critic 的稠密信号: post-training/ch3/3.2-dense-signal.md
          - 3.3 合并机制：OPD / MOPD: post-training/ch3/3.3-merging-opd-mopd.md
      - 4. 数据、环境与工程:
          - 4.1 数据工程: post-training/ch4/4.1-data-engineering.md
          - 4.2 环境工程: post-training/ch4/4.2-environment.md
          - 4.3 基础设施与一致性: post-training/ch4/4.3-infra-consistency.md
          - 4.4 验证器与失败模式: post-training/ch4/4.4-verifier-failures.md
      - 5. 厂商档案:
          - 5.1 DeepSeek: post-training/ch5/5.1-deepseek.md
          - 5.2 Kimi: post-training/ch5/5.2-kimi.md
          - 5.3 Qwen: post-training/ch5/5.3-qwen.md
          - 5.4 MiniMax: post-training/ch5/5.4-minimax.md
          - 5.5 GLM: post-training/ch5/5.5-glm.md
          - 5.6 Seed: post-training/ch5/5.6-seed.md
          - 5.7 LongCat（美团）: post-training/ch5/5.7-longcat.md
          - 5.8 Ling / Ring（蚂蚁）: post-training/ch5/5.8-ling-ring.md
          - 5.9 闭源模型: post-training/ch5/5.9-closed-source.md
      - 6. 全景与演进:
          - 6.1 2026 技术报告全景: post-training/ch6/6.1-overview-2026.md
          - 6.2 演进与对比: post-training/ch6/6.2-evolution.md
      - 附录 A 算法公式速查: post-training/appendix/a-cheatsheet.md
  - Agentic RL 调研报告:
      - 概述: agentic-rl/index.md
      - 1. 算法与核心挑战:
          - 1.1 从推理 RL 到 Agentic RL: agentic-rl/ch1/1.1-overview.md
          - 1.2 奖励信号与训练稳定性: agentic-rl/ch1/1.2-reward-stability.md
          - 1.3 探索效率与信用分配: agentic-rl/ch1/1.3-exploration-credit.md
          - 1.4 工程实践: agentic-rl/ch1/1.4-engineering.md
          - 1.5 算法速查与路线图: agentic-rl/ch1/1.5-algorithm-summary.md
      - 2. 全景分析与展望:
          - 2.1 领域全景与技术路线: agentic-rl/ch2/2.1-landscape.md
          - 2.2 核心判断与未来预测: agentic-rl/ch2/2.2-outlook.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid-custom
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      slugify: !!python/name:pymdownx.slugs.uslugify
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_javascript:
  - javascripts/mermaid.mjs
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css

plugins:
  - search